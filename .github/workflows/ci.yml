name: Colossus CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio httpx pinecone-client supabase ruff

      - name: Lint (ruff)
        run: ruff check src/ scripts/ --exit-non-zero-on-fix

      - name: Unit tests
        run: pytest src/ tests/ -v --tb=short
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          SUPERMEMORY_API_KEY: ${{ secrets.SUPERMEMORY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  memory-health:
    name: Memory Backend Health
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Only run on main push so we don't spam API on every PR
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install httpx pinecone-client

      - name: Memory health check
        run: python scripts/run_memory_health.py --fail-on-degraded
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          SUPERMEMORY_API_KEY: ${{ secrets.SUPERMEMORY_API_KEY }}

  energy-gauntlet:
    name: Energy Gauntlet
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio httpx

      - name: Run energy gauntlet
        run: |
          if [ -f scripts/run_energy_gauntlet.py ]; then
            python scripts/run_energy_gauntlet.py --fail-on-critical
          else
            echo "Energy gauntlet not yet wired — skipping (non-blocking)"
          fi
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          SUPERMEMORY_API_KEY: ${{ secrets.SUPERMEMORY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENERGY_GRID_LIMIT_MW: "1100"
          ENERGY_FEEDER_COUNT: "8"
